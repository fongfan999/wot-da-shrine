<!DOCTYPE html>
<!--
  The home page: / and the /tv code screen. A shared shrine at
  /r/:room is r/index.html. Both pages are put together from src/partials: the shrine's pieces
  are in shrine/, the home page's own in landing/.
-->
<html lang="en">
<head>
  <include src="src/partials/head.html">
  <link rel="stylesheet" href="/src/styles/home.css" />
</head>
<body data-theme="dark" data-state="unlit" data-mode="home" data-fx="full">
  <include src="src/partials/scene.html">

  <include src="src/partials/bar.html">

  <!-- The shrine: the altar and its cards, and the dock under them -->
  <div class="app" id="app">
    <main class="stage">
      <!-- Center: heading + altar -->
      <section class="center">
        <div class="heading">
          <include src="src/partials/shrine/heading.html">
          <include src="src/partials/landing/hero-cta.html">
        </div>

        <div class="altar">
          <include src="src/partials/shrine/altar.html">
          <include src="src/partials/landing/hero-hint.html">
        </div>
        <include src="src/partials/landing/hero-ribbon.html">
      </section>

      <!-- Right: who is here and what they did, then the shrine's own numbers, folded away -->
      <aside class="side" aria-label="Shrine activity">
        <include src="src/partials/shrine/live-card.html">

        <include src="src/partials/landing/open-card.html">

        <include src="src/partials/shrine/shrine-card.html">

        <include src="src/partials/shrine/credit.html">
      </aside>
    </main>

    <include src="src/partials/shrine/dock.html">
  </div>

  <!-- The landing page: everything below the shrine on / (hidden on /tv) -->
  <div class="landing" id="landing" hidden>
    <include src="src/partials/landing/how.html">

    <include src="src/partials/landing/rituals.html">

    <include src="src/partials/landing/channel.html">

    <include src="src/partials/landing/live.html">

    <include src="src/partials/landing/world.html">

    <include src="src/partials/landing/open.html">

    <include src="src/partials/landing/footer.html">
  </div>

  <include src="src/partials/breath.html">

  <include src="src/partials/sheets/join.html">

  <include src="src/partials/sheets/open-shrine.html">

  <include src="src/partials/sheets/cast.html">

  <include src="src/partials/sheets/blame.html">

  <include src="src/partials/sheets/fortune.html">

  <include src="src/partials/sheets/charms.html">

  <include src="src/partials/sheets/share.html">

  <include src="src/partials/tv.html">

  <!-- Toast, and the combo counter over the altar -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="combo" id="combo" aria-hidden="true" hidden><b class="combo__n">×2</b><span class="combo__cap"></span></div>

  <include src="src/partials/settings.html">

  <script type="module" src="/src/home.js"></script>
</body>
</html>
