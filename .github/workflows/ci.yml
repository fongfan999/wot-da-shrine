# Every push to main and every pull request: the size budget, the smoke tests, then the build.
# The same as `npm run check` on your machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Size budget
        run: npm run check:size
      - name: Smoke tests
        run: npm test
      - name: Build
        run: npm run build
