<!-- Bottom: the action dock -->
<footer class="dock">
  <div class="quick" id="quick" aria-label="Quick prayers">
    <button class="quick__chip quick__chip--ritual" id="btn-blame" type="button" title="Burn a blame: write it, burn it, forget it">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4 0-6.5-2.6-6.5-6 0-3 2-4.6 2.6-7.2.3 1.2.9 2 1.9 2.6C10.3 7.5 11.2 5 13.6 3c-.4 2.6.9 4.2 2.4 5.8 1.4 1.5 2.5 3 2.5 6.2 0 3.4-2.5 6-6.5 6z"/><path d="M12 21c-1.8 0-3-1.3-3-3 0-1.6 1.1-2.4 1.6-3.6.6.8 1.4 1.2 2 1.2.4-1 .9-1.8 1.8-2.6.2 1.3.6 2.1 1.1 2.8.4.6.5 1.3.5 2.2 0 1.7-1.2 3-4 3z"/></svg>
      <span data-i18n="blame">Burn a blame</span>
    </button>
    <button class="quick__chip quick__chip--ritual" id="btn-fortune" type="button" title="Draw a fortune: one omikuji per vigil">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-1 18H9z"/><path d="M10 8h4M10 11.5h4M10 15h3"/></svg>
      <span data-i18n="fortune">Draw a fortune</span>
    </button>
    <span class="quick__sep" aria-hidden="true"></span>
    <span class="quick__deal" id="quick-deal"></span>
  </div>
  <form class="pray" id="wish-form" autocomplete="off">
    <label class="sr-only" for="wish-input" data-i18n="wishLabel">Say a prayer to the servers</label>
    <span class="pray__icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M10 3h4M12 3v2"/><path d="M8 7.5C8 6 9.5 5 12 5s4 1 4 2.5v7c0 1.5-1.5 2.5-4 2.5s-4-1-4-2.5z"/><path d="M8 11h8"/><path d="M11 17v2h2v-2M12 19v2"/></svg></span>
    <input class="pray__input" id="wish-input" type="text" maxlength="60" placeholder="Please don’t crash during the demo…" data-i18n-placeholder="wishPlaceholder" />
    <button class="pray__send" type="submit" aria-label="Release prayer lantern">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <div class="actions">
    <button class="act" id="btn-bowl" type="button" title="Ring the bowl (B)">
      <span class="act__icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M9 19.5h6"/><path d="M16.5 4.5l3-1.5M18 8l3-.5"/></svg></span><span class="act__label" data-i18n="bowl">Ring bowl</span><kbd>B</kbd>
    </button>
    <button class="act" id="btn-bow" type="button" title="Bow (P)">
      <span class="act__icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="15" cy="6" r="2"/><path d="M13.5 8.5L9 12l-3 0"/><path d="M9 12l2 4h5l1 4"/><path d="M4 20h16"/></svg></span><span class="act__label" data-i18n="bow">Bow</span><kbd>P</kbd>
    </button>
    <button class="act act--primary" id="btn-light" type="button" title="Light the incense (L)">
      <span class="act__icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M9 20V9M12 20V7M15 20V9"/><path d="M12 4.5c-1-1 .8-2-.2-3"/><path d="M5 20h14"/></svg></span>
      <span class="act__label act__label--unlit" data-i18n="light">Light incense</span>
      <span class="act__label act__label--lit"><span data-i18n="burning">Burning</span> <span id="dock-time">10:00</span></span>
      <kbd>L</kbd>
      <span class="act__burn" aria-hidden="true"><span class="act__burn-bar" id="burn-bar"></span></span>
    </button>
    <button class="act" id="btn-offer" type="button" title="Make an offering (O)" aria-haspopup="menu" aria-expanded="false" aria-controls="tray">
      <span class="act__icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 8c0-1.5 1-1.5 1-3M14 8c0-1.5 1-1.5 1-3"/><path d="M15 3.5l5 4"/></svg></span><span class="act__label" data-i18n="offer">Offer</span><kbd>O</kbd>
    </button>
    <button class="act" id="btn-breathe" type="button" aria-pressed="false" title="Breathe (Space)">
      <span class="act__icon" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="2 3"/><path d="M12 2v1.5M12 20.5V22"/></svg></span><span class="act__label" data-i18n="breathe">Breathe</span><kbd>␣</kbd>
    </button>
  </div>
  <div class="tray" id="tray" role="menu" aria-label="Choose an offering" hidden></div>
</footer>
