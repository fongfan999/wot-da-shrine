<!-- The altar: the shrine around it, the floor the shockwaves roll on, the wish board, the lanterns, the burner and the congregation -->
<div class="temple" id="temple" aria-hidden="true"></div>
<div class="altar__glow"></div>
<div class="altar__floor" id="floor"></div>
<div class="ema" id="ema" aria-hidden="true"><span class="ema__rail"></span></div>
<div class="plantern-row" id="planterns" role="img" hidden><span class="plantern-row__tag"></span></div>
<div class="burner" id="burner">
  <!-- No vigil yet: what to do first, pinned to the incense itself. A click on it reaches the burner, which lights -->
  <button class="light-cue" id="light-cue" type="button" hidden>
    <span class="light-cue__dot" aria-hidden="true"></span>
    <span class="light-cue__text light-cue__text--click" data-i18n="lightCue">Click the censer to light the incense</span>
    <span class="light-cue__text light-cue__text--tap" data-i18n="lightCueTap">Tap the censer to light the incense</span>
  </button>
  <div class="burner__art" id="burner-art" role="img" aria-label="A bronze tripod censer with three incense sticks on a carved altar table, with a tablet for the rack, candles, chrysanthemums and two engineers kneeling on cushions"></div>
</div>
<div class="congregation" id="congregation" aria-hidden="true"></div>
