<!-- The shrine's own numbers, folded away: vitals, karma, rank, the vigils it survived -->
<details class="card card--shrine" id="shrine-card">
  <summary class="shrine-sum">
    <h2 class="label"><span data-i18n="thisShrine">This shrine</span> <span class="label__count" id="records-level"></span></h2>
    <span class="shrine-sum__karma"><b id="sum-karma">0</b> <span data-i18n="karmaUnit">karma</span></span>
    <svg class="ico shrine-sum__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </summary>
  <div class="shrine-card__body">
    <div class="vitals">
      <div class="burn__row">
        <h3 class="label vitals__label"><span class="vitals__of" id="vitals-of">Prod</span> <span data-i18n="vitalsWord">vitals</span></h3>
        <span class="vitals__read"><span class="vitals__bpm" id="vitals-bpm">flatlining</span></span>
      </div>
      <canvas class="vitals__ekg" id="ekg" aria-hidden="true"></canvas>
    </div>
    <dl class="stats">
      <div class="stat"><dt data-i18n="recSurvived">Survived</dt><dd id="rec-survived">0</dd></div>
      <div class="stat"><dt data-i18n="recPrayers">Prayers</dt><dd id="rec-prayers">0</dd></div>
      <div class="stat" id="stat-deploys" hidden><dt data-i18n="recDeploys">Deploys</dt><dd id="rec-deploys">0</dd></div>
      <div class="stat" id="stat-streak" hidden><dt data-i18n="recStreak">Clean in a row</dt><dd id="rec-streak">0</dd></div>
      <div class="stat" id="stat-watches" hidden><dt data-i18n="recWatches">Quiet watches</dt><dd id="rec-watches">0</dd></div>
      <div class="stat" id="stat-vows" hidden><dt data-i18n="recVows">Vows kept</dt><dd id="rec-vows">0</dd></div>
      <div class="stat" id="stat-mornings" hidden><dt data-i18n="recMornings">Mornings in a row</dt><dd id="rec-mornings">0</dd></div>
    </dl>
    <!-- The charm shelf: a slot for every charm, the earned ones in colour; opens the sheet with them all -->
    <button class="charms" id="charms" type="button" hidden aria-haspopup="dialog">
      <span class="charms__head"><span class="label" data-i18n="charmsLabel">Charms</span> <span class="charms__count" id="charms-count"></span><span class="charms__next" id="charms-next"></span></span>
      <span class="charms__row" id="charms-row"></span>
      <span class="reward" id="charms-reward" hidden></span>
    </button>
    <!-- The way to the shrine's next level, in one segment for each person who earned it -->
    <div class="build" id="build" hidden>
      <div class="build__head"><span class="build__what" id="build-what"></span><span class="build__left" id="build-left"></span></div>
      <div class="build__bar" id="build-bar" role="img"></div>
      <p class="reward" id="build-reward" hidden></p>
    </div>
    <!-- This week's vow: the room's one goal, in a segment for each person who moved it; or the way to make one -->
    <div class="vow" id="vow" hidden>
      <div class="build__head"><span class="vow__what" id="vow-what"></span><span class="build__left" id="vow-left"></span></div>
      <div class="build__bar" id="vow-bar" role="img"></div>
    </div>
    <div class="vow-pick" id="vow-pick" hidden>
      <button class="vow-pick__open" id="vow-open" type="button" aria-expanded="false" aria-controls="vow-list"><span class="vow-pick__plus" aria-hidden="true">＋</span><span class="vow-pick__label" data-i18n="vowMake">Make this week’s vow</span><span class="vow-pick__chev" aria-hidden="true">▾</span></button>
      <div class="vow-pick__list" id="vow-list" hidden></div>
    </div>
    <div class="rank" id="rank">
      <span class="rank__badge" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M3 5.5c3 .8 15 .8 18 0M5 9h14M7 5.8V20M17 5.8V20M12 9V6.2"/></svg></span>
      <div class="rank__text">
        <b class="rank__name" id="rank-name">Lurker in #incidents</b>
        <span class="rank__next" id="rank-next"></span>
        <div class="meter meter--thin"><div class="meter__bar" id="rank-bar"></div></div>
      </div>
    </div>
    <!-- Who earned the most karma here this week -->
    <div class="board" id="board" hidden>
      <h3 class="label board__label"><span data-i18n="boardLabel">Keepers this week</span></h3>
      <ol class="board__list" id="board-list"></ol>
      <p class="board__me" id="board-me" hidden></p>
    </div>
    <div class="records-block">
      <h3 class="label" data-i18n="recordsLabel">Vigils</h3>
      <p class="records__level" id="rec-longest" hidden></p>
      <ol class="records" id="records"></ol>
      <p class="records__empty" id="records-empty" data-i18n="recEmpty">No vigil survived yet. Light the incense, and when they’re back, say so.</p>
    </div>
  </div>
</details>
