<!-- Lighting in a quiet room: is this an incident, or just incense? -->
<div class="down-ask" id="down-ask" hidden role="dialog" aria-labelledby="down-ask-title" aria-describedby="down-ask-text">
  <p class="down-ask__title" id="down-ask-title" data-i18n="askTitle">Is something down?</p>
  <p class="down-ask__text" id="down-ask-text" data-i18n="askText">Yes starts the vigil: a Down for clock, and a record when they’re back. No just burns the incense.</p>
  <div class="down-ask__actions">
    <button class="btn btn--glass btn--sm" id="ask-no" type="button" data-i18n="askNo">No, just incense</button>
    <button class="btn btn--ember btn--sm" id="ask-yes" type="button" data-i18n="askYes">Yes, start the vigil</button>
  </div>
</div>
