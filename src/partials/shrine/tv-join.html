<!-- On the war-room TV: scan to kneel here, or cast to this screen -->
<div class="tv-join" id="tv-join" hidden>
  <div class="tv-join__qr" id="tv-qr"></div>
  <div class="tv-join__text">
    <p class="tv-join__hint" data-i18n="tvJoin">Scan to kneel at this altar</p>
    <p class="tv-join__url" id="tv-url"></p>
    <p class="tv-join__cast" id="tv-cast" hidden><span data-i18n="tvCastHere">Cast to this TV</span> <b id="tv-cast-code"></b></p>
  </div>
</div>
<!-- On the TV, when nothing is down: what is playing, and how to change it -->
<p class="tv-now" id="tv-now" hidden aria-live="polite">
  <span class="tv-now__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="tv-now__text"><span class="tv-now__label" data-i18n="trackNow">Now playing</span> <b id="tv-now-track">Vigil</b></span>
  <span class="tv-now__hint" id="tv-now-hint"></span>
</p>
