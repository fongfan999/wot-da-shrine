<!-- Cast to TV: send a shrine to the screen on the wall by the code it shows -->
<div class="sheet sheet--ritual" id="cast" hidden role="dialog" aria-modal="true" aria-labelledby="cast-title">
  <form class="sheet__card cast-form" id="cast-form" autocomplete="off" novalidate>
    <div class="sheet__head">
      <h2 class="sheet__title" id="cast-title"><span data-i18n="castTitle">Put it on the</span> <em data-i18n="castTitleAccent">TV</em></h2>
      <button class="icon-btn" type="button" data-close="cast" aria-label="Close" data-i18n-label="labelClose">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet__body">
      <ol class="cast-form__how">
        <li><span class="cast-form__n">1</span><span><span data-i18n="castHow1">On the big screen, open</span> <button class="cast-form__url" id="cast-url" type="button" title="Copy the address" data-i18n-title="labelCopyTheAddress">/tv</button></span></li>
        <li><span class="cast-form__n">2</span><span data-i18n="castHow2">Type the six-letter code it shows</span></li>
        <li><span class="cast-form__n">3</span><span id="cast-how3" data-i18n="castHow3" data-i18n-once>Pick a shrine and send it: the TV switches to it and stays on it</span></li>
      </ol>
      <label class="cast-form__code">
        <span class="sr-only" data-i18n="castCodeLabel">The code on the TV</span>
        <input id="cast-code" type="text" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="7" placeholder="TV code" data-i18n-placeholder="labelTvCode" aria-describedby="cast-status" />
      </label>
      <label class="cast-form__shrine" id="cast-shrine" hidden>
        <span class="cast-form__shrine-label" data-i18n="castShrine">The shrine to show</span>
        <span class="name-form__field">
          <span class="name-form__prefix" aria-hidden="true">/r/</span>
          <input class="name-form__input" id="cast-room" type="text" maxlength="48" spellcheck="false" />
        </span>
      </label>
      <p class="cast-form__status" id="cast-status" role="status" aria-live="polite"></p>
      <div class="sheet__row">
        <button class="btn btn--accent" id="cast-go" type="submit">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M3 12a8 8 0 0 1 8 8M3 16a4 4 0 0 1 4 4"/><path d="M3 20h.01"/></svg>
          <span data-i18n="castGo">Send to the TV</span>
        </button>
        <button class="btn btn--glass" id="cast-demo" type="button" hidden data-i18n="castDemo">Show the demo instead</button>
      </div>
    </div>
  </form>
</div>
