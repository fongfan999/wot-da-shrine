<!-- This browser knelt in a newer tab, at this shrine or another: one body, one altar, so this one went quiet. Kneeling here again takes it back (shrine.js) -->
<div class="join" id="elsewhere" hidden>
  <div class="join__card" role="alertdialog" aria-labelledby="elsewhere-title" aria-describedby="elsewhere-hint">
    <p class="eyebrow" id="elsewhere-room"></p>
    <h2 class="join__title" id="elsewhere-title"><span id="elsewhere-lead" data-i18n="elsewhereTitle">Already</span> <em id="elsewhere-where" data-i18n="elsewhereTitleAccent">kneeling</em></h2>
    <p class="join__hint" id="elsewhere-hint" data-i18n="elsewhereHint">You opened this shrine in another tab. The kami counts knees, not tabs, and you only brought two.</p>
    <button class="btn btn--accent btn--block" id="btn-elsewhere" type="button" data-i18n="elsewhereBtn">Kneel in this tab</button>
  </div>
</div>
