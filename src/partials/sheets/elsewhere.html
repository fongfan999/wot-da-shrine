<!-- This browser knelt in a newer tab, at this shrine or another: one body, one altar, so this one went quiet. Kneeling here again takes it back (shrine.js) -->
<div class="join" id="elsewhere" hidden>
  <div class="join__card" role="alertdialog" aria-labelledby="elsewhere-title" aria-describedby="elsewhere-hint">
    <p class="eyebrow" id="elsewhere-room"></p>
    <h2 class="join__title" id="elsewhere-title"><span id="elsewhere-lead" data-i18n="elsewhereTitle">Kneeling in</span> <em id="elsewhere-where" data-i18n="elsewhereTitleAccent">another tab</em></h2>
    <p class="join__hint" id="elsewhere-hint" data-i18n="elsewhereHint">You opened this shrine somewhere else, so this tab stepped aside. One of you at the altar is plenty.</p>
    <button class="btn btn--accent btn--block" id="btn-elsewhere" type="button" data-i18n="elsewhereBtn">Pray here instead</button>
  </div>
</div>
