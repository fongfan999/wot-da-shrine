<!-- Until the script has set the heading for this page and started the intro, what the intro reveals stays hidden (never longer than 4s). -->
<script>document.documentElement.classList.add('booting'); setTimeout(() => document.documentElement.classList.remove('booting'), 4000);</script>
<!-- The language this page speaks, as src/lib/locale.js picks it, before the first paint: in another than English,
     the English this page is written in stays hidden while booting, the home page's sentence too, until the script has put the words in. -->
<script>try { const q = new URLSearchParams(location.search).get('lang'); let s = null; try { s = localStorage.getItem('incense:lang'); } catch { /* none saved */ } const ok = (l) => (l === 'en' || l === 'vi' ? l : null); const first = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]).map((l) => ok(String(l).toLowerCase().split('-')[0])).find(Boolean); const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; const lang = ok(q) || ok(s) || (first === 'vi' || tz === 'Asia/Ho_Chi_Minh' || tz === 'Asia/Saigon' ? 'vi' : 'en'); document.documentElement.lang = lang; document.documentElement.dataset.locale = lang; if (lang !== 'en') document.documentElement.classList.add('l10n'); } catch { /* English */ }</script>
