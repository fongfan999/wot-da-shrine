<section class="land land--alt" id="world-now">
  <div class="land__inner">
    <p class="eyebrow eyebrow--live" data-i18n="landWorldEyebrow">Right now, across every shrine</p>
    <h2 class="land__title"><span data-i18n="landWorldTitle">Every shrine,</span> <em data-i18n="landWorldAccent">one pulse.</em></h2>
    <div class="pulse" id="pulse">
      <section class="pulse__now" id="pulse-now" data-burning="0" aria-label="Right now">
        <div class="pulse__ember" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="pulse__label" data-i18n="landWorldNow">Right now</p>
        <p class="pulse__big"><b id="lw-burning">–</b> <span data-i18n="landWorldBurning">shrines burning incense</span></p>
        <p class="pulse__sub" id="lw-now-sub"></p>
      </section>
      <dl class="pulse__totals" aria-label="All time">
        <div class="pulse__stat"><dd id="lw-prayers">–</dd><dt data-i18n="landWorldPrayers">prayers sent to the cloud</dt></div>
        <div class="pulse__stat"><dd id="lw-shrines">–</dd><dt data-i18n="landWorldShrines">shrines opened</dt></div>
        <div class="pulse__stat pulse__stat--good"><dd id="lw-resolved">–</dd><dt data-i18n="landWorldResolved">times the servers came back</dt></div>
        <div class="pulse__stat"><dd id="lw-incense">–</dd><dt data-i18n="landWorldIncense">sticks of incense lit</dt></div>
        <div class="pulse__stat"><dd id="lw-blames">–</dd><dt data-i18n="landWorldBlames">confessions burned</dt></div>
        <div class="pulse__stat"><dd id="lw-fortunes">–</dd><dt data-i18n="landWorldFortunes">fortunes drawn</dt></div>
      </dl>
      <section class="pulse__stream" aria-label="Just now">
        <p class="pulse__label" data-i18n="landWorldStream">Just now</p>
        <ol class="pulse__list" id="lw-stream"></ol>
      </section>
    </div>
  </div>
</section>
