<section class="land land--cta" id="open">
  <div class="land__inner land__inner--narrow">
    <div class="cta-stick" aria-hidden="true">
      <!-- bottom to top: the bowl, the stick burning down, its ember, the smoke -->
      <svg class="cta-stick__bowl" viewBox="0 0 64 30"><path d="M4 4h56l-4 16a8 8 0 0 1-7.8 6H15.8A8 8 0 0 1 8 20z"/></svg>
      <span class="cta-stick__stick"></span>
      <span class="cta-stick__ember"></span>
      <svg class="cta-stick__smoke" viewBox="0 0 60 120"><path pathLength="1" d="M30 118c-8-14 10-22 0-38s8-24 0-40-6-26 2-38"/><path pathLength="1" d="M30 118c6-12-8-20 2-34s-6-24 2-38 8-22 0-34"/></svg>
    </div>
    <h2 class="land__title"><span data-i18n="landCtaTitle">Your servers will go down again. Have the shrine</span> <em data-i18n="landCtaAccent">ready.</em></h2>
    <form class="name-form name-form--cta" id="name-form-2" autocomplete="off">
      <div class="hero-cta__bar">
        <label class="name-form__field hero-cta__field">
          <span class="name-form__prefix" aria-hidden="true">/r/</span>
          <span class="sr-only" data-i18n="nameLabel">Name your shrine</span>
          <input class="name-form__input" type="text" maxlength="48" spellcheck="false" />
        </label>
        <button class="btn btn--accent btn--lg hero-cta__btn" type="submit">
          <span data-i18n="heroCta">Open a shrine</span>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>
    <ul class="cta-chips">
      <li><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg><span data-i18n="landChip1">No account</span></li>
      <li><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg><span data-i18n="landChip2">Nothing to install</span></li>
      <li><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg><span data-i18n="landChip3">Free and open source</span></li>
    </ul>
    <a class="cta-demo" href="/r/demo" data-i18n="landCtaDemo">or kneel at the demo altar first →</a>
  </div>
</section>
