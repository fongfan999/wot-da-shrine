<!-- Praying alone, on the home page: open a team shrine, and what the world is doing -->
<section class="card card--open" id="open-card">
  <h2 class="label" data-i18n="openLabel">Praying alone</h2>
  <p class="card__text" data-i18n="openText">Open a shared shrine and send the link to your team. Everyone's incense, offerings and prayers land on the same altar, live.</p>
  <form class="name-form" id="name-form" autocomplete="off">
    <label class="name-form__field">
      <span class="name-form__prefix" aria-hidden="true">/r/</span>
      <span class="sr-only" data-i18n="nameLabel">Name your shrine</span>
      <input class="name-form__input" id="name-input" type="text" maxlength="48" spellcheck="false" />
    </label>
    <button class="btn btn--accent btn--block" type="submit">
      <span data-i18n="openCta">Open a team shrine</span>
    </button>
  </form>
  <div class="world" id="world" hidden>
    <p class="world__line"><span class="world__dot" aria-hidden="true"></span><span id="world-stats"></span></p>
    <p class="world__ticker" id="world-ticker" aria-live="off"></p>
  </div>
</section>
